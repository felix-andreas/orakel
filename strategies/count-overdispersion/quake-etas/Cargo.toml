[package]
name = "quakeetas"
version = "0.1.0"
edition = "2021"
description = "count-overdispersion/quake-etas: ETAS simulation + gates for Polymarket weekly earthquake-count ladders"

[dependencies]
anyhow = "1"
chrono = "0.4"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde_json = "1"

[profile.release]
opt-level = 3
codegen-units = 1
strip = true
