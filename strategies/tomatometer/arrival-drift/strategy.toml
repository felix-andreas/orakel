(3) The level claim is falsified in DIRECTION on 68 resolved Polymarket ladder boards with
per-leg ground truth: price-minus-realised is +0.010 (t=+0.23) at T-96h and -0.171 (t=-3.34)
at T-6h, concentrated entirely in legs priced >=0.50 -- favourite-longshot bias, pointing the
opposite way to the trade. (5) The break-even table refuses every band; the trade in its
natural form needs q*=0.192 and won 1 of 30. Zero prediction rows.
Full evidence: results/gates-2026-07-26.md
"""
labels = ["class:counting-process", "class:selection-bias", "data:rotten-tomatoes", "family-type:threshold-ladders", "horizon:1-5d", "sim:arrival-process"]

