family = "tomatometer"
variant = "arrival-drift"
summary = "A film's Rotten Tomatoes score is still being counted when the bet settles, and it drifts down as more critics file. The crowd prices the number on the page today."
explainer = """
Rotten Tomatoes gives a film a percentage: not an average rating, just the share of
professional critics who liked it. Polymarket runs weekly bets on whether a new film's
score will be at least 70, at least 80, and so on, and those bets settle at a fixed clock
time — usually the Monday morning after opening weekend. The catch is that critics are
still filing reviews right up to that moment: the number of reviews roughly triples over
the bet's five-day life. And the score tends to slip as they arrive, because the critics
who rush out early are the ones who liked it. Across fourteen films we measured a fall of
about two points over the final three days, and four points from the moment the embargo
lifted, with eleven films down and one up. The crowd appears to price whatever number is
showing on the page right now — its implied score sits half a point ABOVE the displayed
one, when history says it should sit below. So we simulate the reviews still to come
instead of reading today's number. The honest catch is that this is a small sample of
films, the effect is only worth a few points, and the bets are worth trading only when the
score happens to land near one of the thresholds — which is also, conveniently, when
anyone is willing to trade them.
"""
status = "retired"
