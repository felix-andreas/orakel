# Recurring daily family: highest-temperature-in-los-angeles-on-<month>-<day>-<year>
# negRisk event with 11 bucket legs; per-leg condition_ids/token_ids fetched daily
# by `runningmax live`. market_slug below = today's instance.
market_slug = "highest-temperature-in-los-angeles-on-july-23-2026"
condition_id = "" # negRisk family-of-the-day; per-leg ids resolved at runtime via Gamma
added = "2026-07-23"
active = false # parked 2026-07-23: day-1 backtest kill recommendation (results/backtest-2026-07-23.md); tails quote $1-26 top-of-book, edge is a sub-3-min speed race

[params]
city = "los-angeles"
station_id = "KLAX" # Los Angeles International Airport
resolution_source = "https://www.wunderground.com/history/daily/us/ca/los-angeles/KLAX"
feed_url = "https://mesonet.agron.iastate.edu/cgi-bin/request/asos.py?station=KLAX&data=tmpc,tmpf&tz=Etc/UTC&format=onlycomma&report_type=3,4" # + year1/month1/day1..
unit = "F"           # whole-degree Fahrenheit display, 2°F buckets; METAR T-group 0.1°C precision
bucket_width = 2
tz_offset_hours = -7 # PDT (summer 2026)
peak_window_local = "12:00-16:00" # marine layer: KLAX peaks early-afternoon, narrow range
obs_cadence_min = 60 # routine :53 METARs + SPECIs
