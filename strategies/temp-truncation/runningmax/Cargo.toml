[package]
name = "runningmax"
version = "0.1.0"
edition = "2021"
description = "temp-truncation/runningmax: backtest + live tooling for daily city max-temperature bucket families"

[dependencies]
anyhow = "1"
chrono = "0.4"
regex = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
