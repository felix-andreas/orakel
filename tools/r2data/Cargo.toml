[package]
name = "r2data"
version = "0.1.0"
edition = "2021"
description = "Freeze datasets to Cloudflare R2: git keeps the manifest, R2 keeps the bytes."

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
humantime = "2"
# Pure-sync attohttpc backend: no tokio at all, honors HTTPS_PROXY from env,
# native-tls (openssl) honors SSL_CERT_FILE — works behind the agent proxy.
rust-s3 = { version = "0.35", default-features = false, features = ["sync-native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
strip = true
