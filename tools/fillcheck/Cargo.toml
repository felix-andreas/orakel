[package]
name = "fillcheck"
version = "0.1.0"
edition = "2021"
description = "Was the price we scored against a price anyone would actually trade at?"

[dependencies]
anyhow = "1"
chrono = "0.4"
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-sync HTTP: honors HTTPS_PROXY from env, native-tls honors SSL_CERT_FILE —
# same reason tools/r2data picks this backend.
attohttpc = { version = "0.28", default-features = false, features = ["tls-native", "json", "compress"] }

[profile.release]
strip = true
