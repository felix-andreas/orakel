[package]
name = "engine"
version = "0.1.0"
edition = "2021"
description = "orakel execution simulator: what our signals would have earned, after a spread"

# The library is the simulation core and must stay pure (no fs, no net, no clock)
# so it can be compiled to wasm32 for the dashboard:
#   cargo build --lib --release --target wasm32-unknown-unknown
[dependencies]
# chrono without the `clock` feature: RFC3339 parsing/formatting only, no
# system-time access, so the lib stays wasm-clean.
chrono = { version = "0.4", default-features = false, features = ["alloc", "std"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Adapter-only (src/bin/*): R2 access and gzip. Target-gated so a wasm build of
# the library never pulls them in.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "1"
flate2 = "1"
rust-s3 = { version = "0.35", default-features = false, features = ["sync-native-tls"] }
sha2 = "0.10"

[profile.release]
strip = true
