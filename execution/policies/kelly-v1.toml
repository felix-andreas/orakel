name = "kelly"
version = 1
created = "2026-07-25"
character = "Gate plus quarter-Kelly sizing on the executable price. Tests whether sizing by conviction beats equal stakes."

[combine]
method = "best-improvement"

[entry]
min_edge = 0.05
sides = ["buy", "sell"]
delay_hours = 0
require_book = true
min_spread_ok = 0.05
min_depth_usd = 100.0
respect_venue_epsilon = true

[sizing]
method = "fractional-kelly"
kelly_fraction = 0.25
bankroll_usd = 1000.0
max_bankroll_fraction = 0.05
max_per_market_usd = 100.0

[exit]
rule = "hold-to-resolution"

[costs]
assumed_spread = 0.03
max_book_fraction = 0.25
fee_bps = 0
