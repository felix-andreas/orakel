name = "sniper"
version = 1
created = "2026-07-25"
character = "Anchor restricted to top-decile edge, double size, few trades. Tests concentration against breadth — and whether our biggest claimed edges are our best ones."

[combine]
method = "best-improvement"

[entry]
min_edge = 0.05
edge_percentile = 0.90        # only the top decile of |edge| within the signal set
sides = ["buy", "sell"]
delay_hours = 0
require_book = true
min_spread_ok = 0.05
min_depth_usd = 200.0
respect_venue_epsilon = true

[sizing]
method = "fractional-kelly"
kelly_fraction = 0.50
bankroll_usd = 1000.0
max_bankroll_fraction = 0.06
max_per_market_usd = 100.0

[exit]
rule = "hold-to-resolution"

[costs]
assumed_spread = 0.03
max_book_fraction = 0.15
fee_bps = 0
