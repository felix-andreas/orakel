name = "fade"
version = 1
created = "2026-07-25"
character = "Anchor, sell-side only. Encodes the house finding: our sells beat the market (+10c/trade delayed, 62/74 legs) while our buys lose (-7.3c, crypto -17.5c)."

[combine]
method = "best-improvement"

[entry]
min_edge = 0.05
sides = ["sell"]
delay_hours = 0
require_book = true
min_spread_ok = 0.05
min_depth_usd = 200.0
respect_venue_epsilon = true

[sizing]
method = "fractional-kelly"
kelly_fraction = 0.25
bankroll_usd = 1000.0
max_bankroll_fraction = 0.03
max_per_market_usd = 50.0

[exit]
rule = "hold-to-resolution"

[costs]
assumed_spread = 0.03
max_book_fraction = 0.15
fee_bps = 0
