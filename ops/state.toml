# Canonical current operating state of orakel.
# CONSTITUTION.md §1: a structural change not reflected here didn't happen.
# Every change here needs a dated entry in ops/decisions.md with a reason.

[firm]
phase = "bootstrap" # bootstrap | operating
updated = "2026-07-25"

[cadence]
# All triggers must fire inside the working window (CONSTITUTION.md §3),
# times in Europe/Berlin: weekdays 02:00-15:00, weekends 02:00-08:00.
# The CEO is a persistent session; the daily trigger fires INTO it (self-bind,
# keeps all MCP connectors). Cron is UTC: 01:07 = 03:07 German summer / 02:07 winter.
ceo_trigger = "self-bind daily 01:07 UTC (cron 7 1 * * *), armed 2026-07-22 by the CEO"
additional_triggers = ["snapshot worker (Cloudflare cron, 7 * * * *, no LLM)"]
# STALE-FEED GATE (2026-07-27, wiki/reference/stale-feed-gate.md): variants resolving on a
# feed with session hours must not emit a disagreement row while that feed is shut. WTI,
# gold and silver trade 22:00Z->21:00Z Mon-Fri, so weekend runs on barrier-touch/ladder-rv
# predict nothing on those assets. 64 of 95 outstanding rows were priced off a shut feed.
stale_feed_gate = "adopted 2026-07-27; suppress, do not re-price at market"

[models]
# Standing default from CONSTITUTION.md §4 — tune here, log the change.
# Felix 2026-07-24: Opus 5 everywhere; MAX effort where fable/high was used before,
# xhigh or high for the rest. Fable retired from routing.
market_researcher = "opus-5, effort max"
initial_research = "opus-5, effort max"
recurring_research = "opus-5, effort xhigh/high"
execution = "opus-5, effort xhigh/high"
# NOTE: the Agent tool selects MODEL per subagent; EFFORT follows the CEO session's
# setting (Felix controls it via /model + effort). Always name the intended effort in
# the subagent prompt and record the actual model id in worklogs/predictions.

[research]
# A CEILING, NOT A TARGET (2026-07-28, ops/idea-funnel.md). An empty slot costs nothing;
# a slot filled to look busy costs a research day and puts rows in the ledger that have to
# be explained later — tomatometer/arrival-drift was promoted into an empty slot on a
# DESCRIBED gate 0 and was dead the day it was filed. Never fill a slot to raise this ratio.
slots_total = 5
slots_active = 1

[[research.slot]]
id = 1
variant = "barrier-touch/ladder-rv"
trial_started = "2026-07-23"
trial_review_due = "2026-08-02"
# COMPLETENESS GATE, pre-registered 2026-07-29 — BEFORE Friday's rows exist, and written
# down precisely so that invoking it later cannot be a reaction to the numbers.
# 114 rows over 57 markets are outstanding; ~104 resolve Fri 21:00Z and 16 BTC Sat 04:00Z,
# and UMA settles a batch over hours rather than at once. The review reads the evidence
# ONLY when the batch is complete: every outstanding row's market appears in
# predictions/resolutions.csv. If it does not, the review slips ONE day and no further —
# a second slip is a decision to be argued in ops/decisions.md, not an automatic one.
# The gate may only DELAY the review. It may never be used to reopen a completed one.
trial_review_completeness_gate = "all outstanding rows resolved and appended; else +1 day, once"
# DECISION RULE pre-registered 2026-07-30, before any 07-31 resolution — ops/decisions.md.
# Judged PER MARKET (rows are not independent). Promotion needs all four gates: calibration
# (per-market improvement > 0, 95% interval excluding zero), tradeability (>50% fillable AND
# positive exec_edge on that subset), fundability (95% lower bound of the win rate above q*),
# and tail-at-size (effective independent sample after correlation among concurrent legs).
# Discard if the interval lies entirely below zero. EXTEND IS A HIGH BAR: the July board
# universe is exhausted, so an extension means the August cohort — a new trial with a new
# pre-registration, not a continuation.
# The tail is NOT excludable: the two losses were 100% fillable while the flat majority was
# 2/19, so dropping them keeps only the rows nobody would fill. And "we would have no live
# strategies left" is disqualified as an argument, in advance, on purpose.
trial_review_rule = "four gates, per market, pre-registered 2026-07-30; see ops/decisions.md"
# The gates are evaluated by an INDEPENDENT agent, not the CEO and not the slot's researcher
# (2026-07-31, decided before any July board closed). The CEO has run the trial, wrote the
# rule, and presides over a firm with one trial and zero live strategies — three reasons to
# read a marginal number generously, none visible from the inside. The reviewer gets the rule,
# the data and the sizing work, and no context about what the firm would prefer. The CEO makes
# the promote/discard/extend call on that evaluation and records any disagreement explicitly.
# Form: ops/reviews/2026-08-02-ladder-rv.md — thresholds verbatim, values blank, PASS/FAIL/
# UNEVALUABLE per gate. Slot 1 supplies analysis, never verdicts.
trial_review_evaluator = "independent agent; CEO decides on its verdicts, disagreements recorded"

# Slot 2 was released and refilled the same day. arena-rank/favourite-shrinkage PARKED. Its mechanism
# passed the pre-registered band test decisively (+16.8pp, t=+5.94, RoLC +15.2% in the
# fundable band) and has no tradeable board until the August cohort prices (~08-10).
# A slot that cannot trade for two weeks is a slot the firm is pretending to use.




[strategies]
live = []    # promoted variants, e.g. ["barrier-touch/gbm"]
trial = ["barrier-touch/ladder-rv"]
parked = ["arena-rank/favourite-shrinkage"]  # validated mechanism, no tradeable board until ~2026-08-10
retired = ["tomatometer/arrival-drift", "temp-truncation/runningmax", "climate-nowcast/gistemp-era5", "arena-rank/satellites", "series-shape/bo3-derivatives", "count-overdispersion/quake-etas"] # folders stay; post-mortems in results/

[roles]
active = ["ceo", "market-researcher"]
# researcher/executor are instantiated per slot / per live variant

[secrets]
# Presence only — never values. Update when Felix provisions them.
r2 = "present"                # R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (bucket "orakel" is hard-coded)
                              # live round-trip verified 2026-07-22 (push/verify/pull byte-identical)
cloudflare_api_token = "present"
github_token = "present"     # env var AND the orakel-dashboard Worker secret (set 2026-07-25);
                              # dashboard now reads main at request time — verified live
                              # (freshness stamp tracked a commit pushed after the build)
cf_access_service_token = "present" # CF_ACCESS_CLIENT_ID/SECRET; verified 2026-07-22 (no creds→302, creds→200)

[cloudflare]
# Cloudflare Developer Platform MCP is connected in agent sessions (bucket/D1/KV/Workers
# admin + docs search; NOT object upload or Worker deploy — those need the secrets above).
mcp = "connected"
r2_bucket = "orakel"          # created 2026-07-22 via MCP, location ENAM
dashboard_url = "https://orakel-dashboard.felixandreas.workers.dev" # Access ENFORCED (verified 2026-07-22); agents use CF_ACCESS_CLIENT_ID/SECRET headers
# The worker is orakel-snapshot, SINGULAR. Health-checking "orakel-snapshots" returns a
# Cloudflare 404/1042 that looks like a broken worker rather than a typo — 2026-07-28.
snapshot_url = "https://orakel-snapshot.felixandreas.workers.dev" # public, no Access; GET / returns a one-line description
# NOTE: bucket "hollywood" in the same account belongs to another project — never touch.
