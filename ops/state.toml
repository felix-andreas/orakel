# Canonical current operating state of orakel.
# CONSTITUTION.md §1: a structural change not reflected here didn't happen.
# Every change here needs a dated entry in ops/decisions.md with a reason.

[firm]
phase = "bootstrap" # bootstrap | operating
updated = "2026-07-24"

[cadence]
# All triggers must fire inside the working window (CONSTITUTION.md §3),
# times in Europe/Berlin: weekdays 02:00-15:00, weekends 02:00-08:00.
# The CEO is a persistent session; the daily trigger fires INTO it (self-bind,
# keeps all MCP connectors). Cron is UTC: 01:07 = 03:07 German summer / 02:07 winter.
ceo_trigger = "self-bind daily 01:07 UTC (cron 7 1 * * *), armed 2026-07-22 by the CEO"
additional_triggers = ["snapshot worker (Cloudflare cron, 7 * * * *, no LLM)"]

[models]
# Standing default from CONSTITUTION.md §4 — tune here, log the change.
# Felix 2026-07-22: fable only at HIGH effort (never xhigh); opus may run xhigh.
market_researcher = "fable, effort high"
initial_research = "fable, effort high"
recurring_research = "opus, xhigh ok"
execution = "opus, xhigh ok"

[research]
slots_total = 5
slots_active = 1

[[research.slot]]
id = 1
variant = "barrier-touch/ladder-rv"
trial_started = "2026-07-23"
trial_review_due = "2026-08-02"


[strategies]
live = []    # promoted variants, e.g. ["barrier-touch/gbm"]
trial = ["barrier-touch/ladder-rv"]
retired = ["temp-truncation/runningmax", "climate-nowcast/gistemp-era5"] # folders stay; post-mortems in results/

[roles]
active = ["ceo", "market-researcher"]
# researcher/executor are instantiated per slot / per live variant

[secrets]
# Presence only — never values. Update when Felix provisions them.
r2 = "present"                # R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (bucket "orakel" is hard-coded)
                              # live round-trip verified 2026-07-22 (push/verify/pull byte-identical)
cloudflare_api_token = "present"
github_token = "present"
cf_access_service_token = "present" # CF_ACCESS_CLIENT_ID/SECRET; verified 2026-07-22 (no creds→302, creds→200)

[cloudflare]
# Cloudflare Developer Platform MCP is connected in agent sessions (bucket/D1/KV/Workers
# admin + docs search; NOT object upload or Worker deploy — those need the secrets above).
mcp = "connected"
r2_bucket = "orakel"          # created 2026-07-22 via MCP, location ENAM
dashboard_url = "https://orakel-dashboard.felixandreas.workers.dev" # Access ENFORCED (verified 2026-07-22); agents use CF_ACCESS_CLIENT_ID/SECRET headers
# NOTE: bucket "hollywood" in the same account belongs to another project — never touch.
