prediction on that market from the score — the trial reported 25 then 31 scored rows when it
had 26 and 32. The warning was printed on every run since 07-27 and read by nobody, twice
today by me, because I grepped for the headline and filtered it out.
Re-quoted. A malformed RESOLUTION is now a hard error with a non-zero exit (a malformed
prediction row stays a warning): that file is small and hand-appended, so a bad line is
always a mistake, and its blast radius is every row on the market. Verified on a fixture.
"""

