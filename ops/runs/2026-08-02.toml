what = "BACKLOG (new playbook step 10) — instrument the dashboard cold-cache loss"
result = """
Taken because the review slipped and the research cadence was already served. The item's
standing instruction was to measure a cold request BEFORE changing anything else.
Every read now counts itself — attempted, cache hits, network fetches, failures, first-to-last
span — and the numbers ride in an HTML comment in the page footer. In the response rather than
a log, deliberately: a cold request creates a new isolate, so a counter queried afterwards
belongs to a different one. The Err branch of the fetch is counted before it propagates, which
is the "no response" case and precisely the event no counter would otherwise see.
Reproducible on demand — push a commit, poll until the HEAD memo rolls to the new SHA:
  /runs cold   attempted=35 hit=0  net=35 failed=22 span_ms=369
  /runs warm   attempted=24 hit=21 net=3  failed=0  span_ms=130
  /state cold  attempted=2  hit=0  net=2  failed=0  span_ms=113
Two independent cold runs agreed to the read.
"""

[[steps]]
n = 5
what = "Concurrency refuted by measurement, and my 07-28 note corrected"
result = """
Bounding in-flight reads to 4 gave attempted=35 hit=0 net=35 failed=22 — IDENTICAL — and cost
163ms. Pacing changes nothing. Reverted.
The 07-28 note claiming that bounding "made it worse" (3 lost files -> 6) was an artifact of
counting distinct file NAMES in a banner rather than counting reads. That correction is
recorded in data.rs where the wrong claim lived, not just in a manifest.
Time is refuted too at 369ms, and a bad pinned ref was already refuted (a rejected ref returns
a status; these return none).
What survives has arithmetic: the per-request subrequest budget, with Cache API operations
spending it too. A cold read costs ~3 subrequests (cache.get miss, fetch, cache.put) where a
warm read costs 1, so /runs costs ~24 warm and ~70 cold against a 50 ceiling — predicting it
runs out around read 16, which is what 13 successes and 22 failures look like. It also explains
why pacing cannot help (a count, not a rate), why /state at 2 reads never fails, and why only a
SHA change triggers it.
Next experiment named and cheap: disable the Cache API for one deploy. failed -> 0 confirms it,
failed = 22 kills it.
"""

