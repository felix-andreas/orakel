[[steps]]
n = 9
what = "Dashboard: two hypotheses tried, both disproved, one diagnostic kept"
result = """
Felix's "Some of this page is missing" banner reproduced: it fires on the FIRST request
after a push and in none of 120 requests outside that window. I assumed a SHA-propagation
race and shipped an unpinned retry; then assumed burst concurrency and capped in-flight
reads at 6. Neither worked and both are reverted — capping made /runs worse (3 lost files ->
6). The failure reasons settled it: "pinned no response, unpinned no response", no status at
all, so the subrequest never happened. What survives is a per-request subrequest budget that
only a cold cache can exhaust, which is why a push (new SHA -> every pinned URL changes ->
every cache entry misses) triggers it. The retry was actively counterproductive there.
Kept: failed reads now record WHY, not just which file. That is the only reason any of this
is known, and it turned an afternoon of guessing into a measurement.
"""

