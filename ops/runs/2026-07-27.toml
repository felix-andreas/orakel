summary = """
The trial's first real test arrived and we failed it: WTI touched $85 and ladder-rv's headline
flipped from +0.000945 to -0.0172. The cause turned out to be structural rather than a
miscalibration — the resolving feed was shut for 28.8 hours while the book repriced, and 64 of
95 outstanding rows were priced the same way. Adopted a stale-feed gate. The leg-sum/null check
that had slipped three runs came back CLEAN, so the evidence base is not an artifact. Market
researcher filed nothing and was right to.
"""

