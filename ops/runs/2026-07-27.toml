while the market went 0.525 -> 0.715. will-wti-dip-to-90-from-july-25 also touched.
Mean paired improvement +0.000945 (21 rows) -> -0.0172 (25 rows). dip-to-85 alone is -0.4510,
larger than the total loss of -0.4312; every other row still nets +0.0198.
Tradeability 2/21 -> 6/25, because mid-board WTI legs are the reachable ones — so the rows we
could have traded are the rows we lost on.
"""

[[steps]]
n = 4
what = "Scoring gained a per-MARKET aggregate level"
result = """
Rows are not independent: we predict the same market every morning, so one barrier touch is
scored once per day it was open. Per market: 19 markets, -0.0051. Per row: 25 rows, -0.0173 —
3.4x worse purely because we predicted the losing market four times. Both negative, so the flip
is real either way; the magnitude was counting-dependent and is now visible as such. It would
have deflated the 21/21 headline too.
"""

[[steps]]
n = 5
what = "Slot 1 — barrier-touch/ladder-rv day 5 (claude-opus-5, xhigh)"
result = """
LEG-SUM / NULL CHECK CLEARS (asked for since 07-25, slipped three runs). No null beats the
market at either checkpoint the trial uses, in all seven assets separately, at both anchors,
stable across clip epsilon. Our model beats the market at both. The headline is not an artifact.
Two caveats: the board-creation anchor DOES lose to a base-rate null (85% of legs quote 45-55c
there) but we have never used it; and gold's window-open Brier margin does not survive a leg-sum
gate (-0.0189 -> -0.0001), so that claim is withdrawn and gold stays tradeable on the
daily-checkpoint margin instead.
Also: both cmd_live defects fixed, archive freeze done, 07-31 identity 51/51 clean, epsilon
screen clear. 11 rows proposed and appended after verification (ledger 121 -> 132).
"""

[[steps]]
n = 6
what = "The 07-26 divergence explained — and it is systemic"
result = """
The 07-25 and 07-26 runs read the SAME spot (Fri 20:59Z close, 90.46), sigma and remaining
sessions. WTI/metals trade 22:00Z-21:00Z Mon-Fri, so the feed was shut 28.8h while the book
repriced 0.475 -> 0.715 during exactly that closure. Our model moved -2.8 points, caused by a
14-day realized-vol lookback sliding across two closed days — arithmetic that looks like a view.
Solving the market's quote for spot gives 87.3-88.0 against our 90.46: it priced a LOWER LEVEL,
not a wider distribution, and no sigma recovers a level from a Friday close. No feed we hold
printed during the closure. 64 of 95 outstanding rows were priced this way.
"""

[[steps]]
n = 7
what = "Stale-feed gate ADOPTED (CEO decision)"
result = """
Suppress the row, rather than re-price it at the market — a row whose edge is zero by
construction is not evidence, it is a row that later gets counted as one. Weekend runs now emit
nothing on WTI/gold/silver, which changes the cadence. wiki/reference/stale-feed-gate.md written
as the FOURTH way a quoted price misleads and the only one where OUR number is the broken one.
"""

[[steps]]
n = 8
what = "Market researcher (claude-opus-5, max) — filed nothing, correctly"
result = """
Worked up and killed box office. Every venue check passed perfectly: 0 of 12,187 Kalshi series,
